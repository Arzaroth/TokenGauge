name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal: everything a tag would build and check, published nowhere. A
  # tag is never moved, so the first run of a changed release must not be the
  # one that ships.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'scripts/package.sh'
      - 'scripts/arch.sh'
      - 'scripts/check-package.sh'
      - 'scripts/build.sh'
      - 'scripts/package-macos.sh'
      - 'scripts/tokengauge-daemon.service'
      - 'packaging/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.6.3)'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REF: ${{ github.event.inputs.tag || github.ref }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as.
      - name: The tag
        shell: bash
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/tokengauge-waybar/Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        run: cargo install cross

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Nothing ships that CI has not already built the same way.
      - name: Build the frontend payloads
        run: |
          pnpm install --frozen-lockfile
          scripts/build.sh

      - name: Build
        # Build only the two Linux binaries shipped in the release archive.
        run: cross build --release --target x86_64-unknown-linux-gnu -p tokengauge-waybar -p tokengauge-tui

      - name: Package
        run: |
          # Sanitize the tag/ref so path separators can't break the archive path.
          SAFE_REF="${REF_NAME//[^A-Za-z0-9._-]/_}"
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/tokengauge dist/
          cp target/x86_64-unknown-linux-gnu/release/tokengauge-tui dist/
          # Transitional: a 0.22.x updater only looks for the old name, so the
          # archive carries a real copy under it. Drop once those are gone.
          cp target/x86_64-unknown-linux-gnu/release/tokengauge dist/tokengauge-waybar
          # The Plasma applet, GNOME extension, and Omarchy widget are QML and
          # JavaScript installed outside ~/.local/bin. Shipping them here is what
          # lets --update refresh them and --install-frontend fetch one; without
          # them a new binary keeps driving whatever QML the box already had.
          # scripts/build.sh assembled these in this exact layout, with the
          # GNOME extension's TypeScript compiled and dropped. Copying the
          # source directories instead would ship .ts files the shell refuses.
          cp -r build/frontends dist/frontends
          # MIT asks that its notice travel with a copy, and an archive is a
          # copy. THIRD-PARTY.md is what points at the notices it applies to.
          cp LICENSE LICENSE-MIT LICENSE-WTFPL THIRD-PARTY.md dist/
          # The daemon's unit, for the packages built from this archive.
          mkdir -p dist/systemd
          cp scripts/tokengauge-daemon.service dist/systemd/
          tar -czf "dist/tokengauge-${SAFE_REF}-linux-x86_64.tar.gz" -C dist tokengauge tokengauge-waybar tokengauge-tui frontends systemd LICENSE LICENSE-MIT LICENSE-WTFPL THIRD-PARTY.md

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengauge-x86_64
          path: dist/tokengauge-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as.
      - name: The tag
        shell: bash
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/tokengauge-waybar/Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        run: cargo install cross

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Nothing ships that CI has not already built the same way.
      - name: Build the frontend payloads
        run: |
          pnpm install --frozen-lockfile
          scripts/build.sh

      - name: Build
        # Build only the two Linux binaries shipped in the release archive.
        run: cross build --release --target aarch64-unknown-linux-gnu -p tokengauge-waybar -p tokengauge-tui

      - name: Package
        run: |
          # Sanitize the tag/ref so path separators can't break the archive path.
          SAFE_REF="${REF_NAME//[^A-Za-z0-9._-]/_}"
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/tokengauge dist/
          cp target/aarch64-unknown-linux-gnu/release/tokengauge-tui dist/
          # Transitional: a 0.22.x updater only looks for the old name, so the
          # archive carries a real copy under it. Drop once those are gone.
          cp target/aarch64-unknown-linux-gnu/release/tokengauge dist/tokengauge-waybar
          # The Plasma applet, GNOME extension, and Omarchy widget are QML and
          # JavaScript installed outside ~/.local/bin. Shipping them here is what
          # lets --update refresh them and --install-frontend fetch one; without
          # them a new binary keeps driving whatever QML the box already had.
          # scripts/build.sh assembled these in this exact layout, with the
          # GNOME extension's TypeScript compiled and dropped. Copying the
          # source directories instead would ship .ts files the shell refuses.
          cp -r build/frontends dist/frontends
          # MIT asks that its notice travel with a copy, and an archive is a
          # copy. THIRD-PARTY.md is what points at the notices it applies to.
          cp LICENSE LICENSE-MIT LICENSE-WTFPL THIRD-PARTY.md dist/
          # The daemon's unit, for the packages built from this archive.
          mkdir -p dist/systemd
          cp scripts/tokengauge-daemon.service dist/systemd/
          tar -czf "dist/tokengauge-${SAFE_REF}-linux-aarch64.tar.gz" -C dist tokengauge tokengauge-waybar tokengauge-tui frontends systemd LICENSE LICENSE-MIT LICENSE-WTFPL THIRD-PARTY.md

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengauge-aarch64
          path: dist/tokengauge-*-linux-aarch64.tar.gz
          if-no-files-found: error


  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as.
      - name: The tag
        shell: bash
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/tokengauge-waybar/Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        # The TUI and the tray GUI run on Windows; waybar is Linux-only.
        run: cargo build --release --target x86_64-pc-windows-msvc -p tokengauge-tui -p tokengauge-tray

      - name: Package
        shell: pwsh
        run: |
          # Sanitize the tag/ref so path separators can't break out of dist/.
          # Must match scripts/install.ps1 so the published asset name lines up.
          $safe = $env:REF_NAME -replace '[^A-Za-z0-9._-]', '_'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/tokengauge-tui.exe dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/tokengauge-tray.exe dist/
          # MIT asks that its notice travel with a copy, and an archive is a copy.
          Copy-Item LICENSE,LICENSE-MIT,LICENSE-WTFPL,THIRD-PARTY.md dist/
          Compress-Archive -Path dist/tokengauge-tui.exe,dist/tokengauge-tray.exe,dist/LICENSE,dist/LICENSE-MIT,dist/LICENSE-WTFPL,dist/THIRD-PARTY.md -DestinationPath "dist/tokengauge-$safe-windows-x86_64.zip" -Force

      # The per-user MSI, for install and uninstall through Settings > Apps.
      # The zip stays the primary asset: an unsigned MSI trips SmartScreen,
      # while `install.ps1` does not.
      #
      # `win64`, deliberately not `windows-x86_64`: every updater already
      # shipped picks its download by substring and would happily hand this
      # package to the zip extractor. See ARCHIVE_SUFFIX in selvedge.
      - name: Build MSI
        shell: pwsh
        run: |
          $safe = $env:REF_NAME -replace '[^A-Za-z0-9._-]', '_'
          # ProductVersion is numeric only: no leading v, no pre-release suffix.
          $msiVersion = ($safe -replace '^v', '') -replace '[-+].*$', ''
          dotnet tool install --global wix --version 5.0.2
          # The tool directory is not on PATH until a new shell.
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          wix build -arch x64 -d Version=$msiVersion -d BinDir=dist `
            -o "dist/tokengauge-$safe-win64.msi" packaging/windows/tokengauge.wxs

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengauge-windows-x86_64
          path: |
            dist/tokengauge-*-windows-x86_64.zip
            dist/tokengauge-*-win64.msi
          if-no-files-found: error

  # The daemon and CLI, the TUI, and the menu-bar tray. No desktop payloads:
  # the Plasma, GNOME and Omarchy frontends are Linux shells. The runner is
  # arm64 and cross-builds x86_64 with its own Xcode, so no `cross` here.
  build-macos:
    runs-on: macos-latest
    # Signing and notarization need the Developer ID secrets; a fork without
    # them still releases, unsigned, the way it did before they existed.
    env:
      # A rehearsal neither signs nor notarizes: PR CI already builds the
      # bundle unsigned, and Apple's queue is no place for a pull request.
      APPLE_SIGNING: ${{ github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12 != '' }}
      APPLE_NOTARY: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as.
      - name: The tag
        shell: bash
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/tokengauge-waybar/Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}

      # rsvg-convert renders the app icon from assets/tokengauge.svg.
      - name: Install librsvg
        run: brew install librsvg

      - name: Build
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" -p tokengauge-waybar -p tokengauge-tui -p tokengauge-tray
          done

      - name: Developer ID certificate
        if: env.APPLE_SIGNING == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' -v team="($TEAM_ID)" '/Developer ID Application/ && index($2, team) {print $2; exit}')
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity for team $TEAM_ID in the certificate"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Signs the per-architecture binaries the tarballs carry, and builds
      # TokenGauge.app and its DMG from them.
      - name: Sign, and build the app
        run: scripts/package-macos.sh "$REF_NAME"

      # A bare binary cannot carry a stapled ticket, so the tarballs' binaries
      # are notarized online: Gatekeeper asks Apple the first time one runs.
      # The DMG gets its ticket stapled, so the app opens offline too.
      - name: Notarization
        if: env.APPLE_SIGNING == 'true' && env.APPLE_NOTARY == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$API_KEY" | base64 --decode > "$key"
          notarize() {
            local file="$1" out="$RUNNER_TEMP/notary.json" id status
            xcrun notarytool submit "$file" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
              --wait --timeout 60m --output-format json > "$out" || true
            cat "$out"
            id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$out" 2>/dev/null || true)
            status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$out" 2>/dev/null || true)
            if [ "$status" != Accepted ]; then
              if [ -n "$id" ]; then
                xcrun notarytool log "$id" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
              fi
              echo "::error::notarization of $file: ${status:-no answer}"
              exit 1
            fi
          }
          mkdir -p "$RUNNER_TEMP/binaries"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "$RUNNER_TEMP/binaries/$target"
            cp "target/$target/release/tokengauge" "target/$target/release/tokengauge-tui" \
              "target/$target/release/tokengauge-tray" "$RUNNER_TEMP/binaries/$target/"
          done
          ditto -c -k --keepParent "$RUNNER_TEMP/binaries" "$RUNNER_TEMP/binaries.zip"
          notarize "$RUNNER_TEMP/binaries.zip"
          dmg=$(ls dist/*.dmg)
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          rm "$key"

      - name: What Gatekeeper will say
        if: env.APPLE_SIGNING == 'true'
        run: |
          codesign -dv --verbose=2 dist/TokenGauge.app 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|flags"
          if [ "$APPLE_NOTARY" = true ]; then
            spctl --assess --type execute -vv dist/TokenGauge.app
            xcrun stapler validate dist/*.dmg
            spctl --assess --type open --context context:primary-signature -vv dist/*.dmg
          fi

      - name: Package
        run: |
          SAFE_REF="${REF_NAME//[^A-Za-z0-9._-]/_}"
          package() {
            local target="$1" asset="$2" dir="dist/$1"
            mkdir -p "$dir"
            cp "target/$target/release/tokengauge" "target/$target/release/tokengauge-tui" \
              "target/$target/release/tokengauge-tray" "$dir/"
            cp LICENSE LICENSE-MIT LICENSE-WTFPL THIRD-PARTY.md "$dir/"
            tar -czf "$asset" -C "$dir" tokengauge tokengauge-tui tokengauge-tray LICENSE LICENSE-MIT LICENSE-WTFPL THIRD-PARTY.md
          }
          package aarch64-apple-darwin "dist/tokengauge-${SAFE_REF}-macos-aarch64.tar.gz"
          package x86_64-apple-darwin "dist/tokengauge-${SAFE_REF}-macos-x86_64.tar.gz"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengauge-macos
          path: |
            dist/tokengauge-*-macos-*.tar.gz
            dist/tokengauge-*-macos-universal.dmg
          if-no-files-found: error

  # The .deb and .rpm, made from the archives rather than beside them, so a
  # package and `--update` install the same bytes.
  linux-packages:
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: The archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: archives
          pattern: tokengauge-*
          merge-multiple: true

      - name: nfpm and glib-compile-schemas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin
          deb="nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$deb"
          echo "$NFPM_SHA256  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Package
        run: |
          for archive in archives/tokengauge-*-linux-*.tar.gz; do
            scripts/package.sh "$archive" dist
          done
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengauge-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-x86_64, build-aarch64, build-windows, build-macos, linux-packages]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as.
      - name: The tag
        shell: bash
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/tokengauge-waybar/Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: tokengauge-*
          merge-multiple: true

      # What scripts/install.sh checks a download against before installing
      # it, taken once every asset is in.
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${REF_NAME#v}"
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION - falling back to auto-generated notes."
          fi

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.REF_NAME }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
