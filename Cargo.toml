[workspace]
resolver = "2"
members = [
  "crates/tokengauge-core",
  "crates/tokengauge-waybar",
  "crates/tokengauge-tui",
  "crates/tokengauge-tray"
]
# The waybar crate is Linux-only (Waybar) and does
# not build on Windows or macOS. `default-members` limits a bare `cargo build`
# (and `cargo test`) to the cross-platform crates so the workspace builds on any
# OS. On Linux you can still build everything with `cargo build --workspace`.
default-members = [
  "crates/tokengauge-core",
  "crates/tokengauge-tui"
]

[workspace.package]
# File::try_lock / std::fs::TryLockError (codex refresh lock) stabilized in 1.89.
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The updater and the payload installer, shared with TailGauge. Off by
# default: `frontend` and `state` come without a network stack, and the crates
# that fetch a release ask for `self-update` by name.
selvedge = { git = "https://github.com/Arzaroth/selvedge", tag = "v0.3.0", default-features = false }
