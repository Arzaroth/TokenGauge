[package]
name = "tokengauge-core"
version = "0.35.1"
edition = "2024"
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
toml_edit = "0.22"
dirs = "5.0"
# Device id derivation. Already in the tree via rustls, so no new crate.
sha2 = "0.10"
# Fleet sync envelope. Pure Rust, no C, no async runtime; `hmac` also signs the
# S3 requests the object-store transport makes.
chacha20poly1305 = "0.10"
hmac = "0.12"
flate2 = "1"
# ponytail. Not feature-gated - tray needs it and popover already links GTK4,
# so the weight is noise; gate later only if popover build bites. It is why a
# default build still links reqwest: `self-update` governs self_update, not the
# network stack as a whole.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# The updater and the payload installer, shared with TailGauge. Taken without
# default features so the half that links a network stack arrives only with
# `self-update`; `frontend` and `state` are always here, because a GUI reads
# the cached check and installs payloads without ever fetching one.
selvedge = { workspace = true }

[dev-dependencies]
# The cost fixture test builds dates and reads the ccusage golden.
chrono = { workspace = true }
serde_json = { workspace = true }

# Claude Code's OS credential store: the macOS keychain and the Windows
# Credential Manager. Per-target and native-only so Linux pulls no
# secret-service / dbus stack - there Claude keeps the token in the file.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[features]
self-update = ["selvedge/self-update"]
