name: CI

on:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Test
        # --all-features so the self-update module's tests (the binary-name
        # compat alias among them) actually run; clippy below already uses it.
        run: cargo test --workspace --all-features

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The desktop frontends install separately from the binary, so a syntax error
  # in one of them ships without any Rust job noticing. qmllint resolves no
  # imports here (Kirigami, Plasma and Quickshell are not installed) and exits 0
  # on the resulting warnings - it is the syntax that is being checked.
  frontends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend payloads
        run: scripts/build.sh

      - name: Lint QML
        run: |
          shopt -s globstar nullglob
          files=(plasma/**/*.qml omarchy/**/*.qml)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no QML found - the glob has gone stale" >&2
            exit 1
          fi
          # Every import here is unresolvable in CI - Kirigami, Plasma and
          # Quickshell are not installed - and some qmllint builds exit
          # non-zero on those warnings while others exit 0. So the exit code
          # is not the signal: a `[syntax]` diagnostic is. That is the failure
          # that actually ships, since a frontend with a syntax error loads as
          # a blank panel.
          set +e
          out=$(/usr/lib/qt6/bin/qmllint "${files[@]}" 2>&1)
          status=$?
          set -e
          echo "$out"
          if [[ $status -eq 126 || $status -eq 127 ]]; then
            echo "::error::qmllint could not be run (exit $status)"
            exit 1
          fi
          if grep -q '\[syntax\]' <<<"$out"; then
            echo "::error::QML syntax error - see the [syntax] diagnostics above"
            exit 1
          fi

      - name: Typecheck the GNOME extension
        run: pnpm typecheck

      # The compiler has already read the sources; this reads what ships, so a
      # tsconfig that started emitting something GJS cannot parse is caught
      # here rather than by a user whose panel went blank.
      - name: Check the GNOME extension
        run: |
          shopt -s globstar nullglob
          files=(build/frontends/gnome/**/*.js)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no compiled extension found - the build or the glob has gone stale" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --input-type=module --check < "$file"
          done

      - name: Check the frontend manifests
        run: |
          shopt -s globstar nullglob
          files=(gnome/**/metadata.json omarchy/**/manifest.json plasma/**/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no frontend manifests found - the glob has gone stale" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}

      # Windows builds the cross-platform crates plus tokengauge-tray, whose
      # GUI deps are cfg(windows)-gated and so cannot be type-checked in the
      # Linux job. The waybar crate is Linux-only. Formatting and clippy are
      # OS-independent and run in the Linux `build` job.
      - name: Build
        run: cargo build -p tokengauge-core -p tokengauge-tui -p tokengauge-tray

      - name: Test
        run: cargo test -p tokengauge-core -p tokengauge-tui

      # The only job that can lint the tray: its GUI deps are
      # cfg(windows)-gated, so on Linux the whole crate compiles away to a
      # stub. Without this the tray is built here but never linted anywhere,
      # and checking it locally means hand-editing its Cargo.toml.
      - name: Clippy (tray)
        run: cargo clippy -p tokengauge-tray --all-targets -- -D warnings

      # WiX only supports Windows, so this is the only job that can tell
      # whether the installer authoring still builds. The MSI itself is thrown
      # away; the release workflow builds the one users get.
      - name: Build MSI (validation only)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          wix build -arch x64 -d Version=0.0.1 -d BinDir=target/debug `
            -o "$env:RUNNER_TEMP/tokengauge-ci.msi" packaging/windows/tokengauge.wxs
